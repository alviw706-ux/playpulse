<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#090b18">
<meta name="description" content="NEON DASH — a fast, original one-tap arcade challenge.">
<title>NEON DASH — One Tap. Keep Moving.</title>
<style>
:root{--bg:#090b18;--panel:#12172a;--cyan:#61f4e8;--pink:#ff5eaa;--yellow:#ffe66d;--muted:#9aa6c8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 0%,#1b2450 0%,var(--bg) 55%);color:#f7f8ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{display:flex;justify-content:center;align-items:center;padding:16px;overflow-x:hidden}
button{font:inherit}
.app{width:min(100%,560px);margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.brand{font-size:clamp(23px,6vw,32px);font-weight:1000;letter-spacing:.09em;text-shadow:0 0 18px #61f4e866}
.brand span{color:var(--cyan)}
.tag{font-size:11px;color:var(--muted);letter-spacing:.16em;font-weight:800}
.iconbtn{border:1px solid #ffffff22;background:#ffffff0b;color:white;border-radius:13px;padding:10px 12px;cursor:pointer}
.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:10px}
.stat{background:#ffffff0b;border:1px solid #ffffff16;border-radius:14px;padding:10px;text-align:center}
.stat small{display:block;color:var(--muted);font-size:10px;letter-spacing:.13em;font-weight:800}
.stat strong{display:block;font-size:22px;margin-top:2px;font-variant-numeric:tabular-nums}
.gamewrap{position:relative;border:1px solid #8ceee933;border-radius:23px;overflow:hidden;box-shadow:0 18px 70px #0008,0 0 35px #61f4e811;background:#090d20}
canvas{display:block;width:100%;height:auto;aspect-ratio:480/650;touch-action:manipulation}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(#080b1dcc,#080b1df0);text-align:center}
.overlay.hidden{display:none}
.dialog{width:min(100%,340px)}
.eyebrow{color:var(--cyan);font-size:11px;font-weight:900;letter-spacing:.22em}
h1{font-size:clamp(34px,9vw,50px);line-height:.98;margin:12px 0;text-shadow:0 0 24px #61f4e855}
.dialog p{color:#bdc7e4;line-height:1.55;font-size:14px}
.primary{border:0;border-radius:15px;padding:14px 24px;margin-top:12px;width:100%;font-weight:950;letter-spacing:.08em;color:#07131c;background:linear-gradient(100deg,var(--cyan),#a3ffe7);box-shadow:0 8px 26px #61f4e833;cursor:pointer}
.secondary{border:1px solid #ffffff2b;border-radius:14px;padding:12px 18px;margin-top:9px;width:100%;font-weight:800;color:white;background:#ffffff0c;cursor:pointer}
.hint{text-align:center;color:var(--muted);font-size:12px;margin:12px 0 0}
.controls{display:flex;justify-content:space-between;gap:10px;margin-top:12px}
.controls button{flex:1}
.footer{text-align:center;color:#7783a8;font-size:10px;letter-spacing:.12em;margin-top:14px}
@media(min-width:600px){body{padding:22px}.gamewrap{border-radius:26px}}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div><div class="brand">NEON<span>DASH</span></div><div class="tag">ONE TAP. KEEP MOVING.</div></div>
    <button class="iconbtn" id="soundBtn" aria-label="Toggle sound">🔊 SOUND</button>
  </header>
  <section class="hud" aria-label="Game statistics">
    <div class="stat"><small>SCORE</small><strong id="score">0</strong></div>
    <div class="stat"><small>BEST</small><strong id="best">0</strong></div>
    <div class="stat"><small>STREAK</small><strong id="streak">0×</strong></div>
  </section>
  <section class="gamewrap">
    <canvas id="game" width="480" height="650" aria-label="Neon Dash game area"></canvas>
    <div class="overlay" id="overlay">
      <div class="dialog">
        <div class="eyebrow" id="overlayEyebrow">A QUICK ARCADE CHALLENGE</div>
        <h1 id="overlayTitle">READY<br>TO DASH?</h1>
        <p id="overlayText">Tap anywhere to switch lanes. Dodge the pulse blocks, collect the glowing sparks, and see how long you can last.</p>
        <button class="primary" id="startBtn">START GAME</button>
        <button class="secondary" id="shareBtn">SHARE YOUR SCORE</button>
      </div>
    </div>
  </section>
  <div class="controls">
    <button class="iconbtn" id="pauseBtn">Ⅱ PAUSE</button>
    <button class="iconbtn" id="howBtn">? HOW TO PLAY</button>
  </div>
  <p class="hint">TAP / CLICK / PRESS SPACE TO SWITCH LANES</p>
  <div class="footer">ORIGINAL MINI GAME · MADE FOR QUICK REPLAYS</div>
</main>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const W=480,H=650,lanes=[155,325];
let state='ready',score=0,best=Number(localStorage.getItem('neondash-best')||0),streak=0,lane=0;
let playerY=520,objects=[],particles=[],spawn=0,speed=210,last=0,elapsed=0,shake=0,sound=true,audio=null;
$('best').textContent=best;
const rand=(a,b)=>a+Math.random()*(b-a);
function tone(freq=440,dur=.07,type='sine',vol=.035){
 if(!sound)return;
 try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}
}
function updateHUD(){$('score').textContent=score;$('best').textContent=best;$('streak').textContent=streak+'×'}
function reset(){score=0;streak=0;lane=0;objects=[];particles=[];spawn=.5;speed=210;elapsed=0;shake=0;playerY=520;updateHUD()}
function start(){reset();state='playing';$('overlay').classList.add('hidden');$('pauseBtn').textContent='Ⅱ PAUSE';last=performance.now();tone(520,.12)}
function switchLane(){if(state!=='playing')return;lane=1-lane;tone(320+lane*150,.055,'triangle',.025);burst(lanes[lane],playerY,'#61f4e8',5)}
function burst(x,y,color,n=10){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-140,140),vy:rand(-170,100),life:rand(.25,.6),max:.6,color,r:rand(2,4)})}
function spawnObject(){
 const obstacle=Math.random()<.68;
 const l=Math.random()<.5?0:1;
 objects.push({x:lanes[l],y:-35,lane:l,type:obstacle?'block':'spark',size:obstacle?rand(25,34):13,passed:false,phase:rand(0,6.28)});
}
function gameOver(){
 state='over';tone(110,.35,'sawtooth',.05);
 if(score>best){best=score;localStorage.setItem('neondash-best',String(best))}
 updateHUD();
 $('overlayEyebrow').textContent='RUN COMPLETE';
 $('overlayTitle').innerHTML='NICE<br>TRY!';
 $('overlayText').textContent=`You scored ${score}. ${score>=best&&score>0?'New personal best!':'Can you beat your best of '+best+'?'} One more run?`;
 $('startBtn').textContent='PLAY AGAIN';$('overlay').classList.remove('hidden');
}
function pause(){if(state==='playing'){state='paused';$('overlayEyebrow').textContent='TAKE A BREATHER';$('overlayTitle').textContent='PAUSED';$('overlayText').textContent='Your run is waiting. Jump back in when you are ready.';$('startBtn').textContent='RESUME';$('overlay').classList.remove('hidden');$('pauseBtn').textContent='▶ RESUME'}else if(state==='paused'){state='playing';$('overlay').classList.add('hidden');$('pauseBtn').textContent='Ⅱ PAUSE';last=performance.now()}}
function drawBackground(t){
 ctx.fillStyle='#090d20';ctx.fillRect(0,0,W,H);
 let g=ctx.createRadialGradient(240,120,10,240,260,440);g.addColorStop(0,'#18244a');g.addColorStop(1,'#090d20');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.save();ctx.globalAlpha=.18;ctx.strokeStyle='#61f4e8';ctx.lineWidth=1;
 for(let y=(t*.05)%44;y<H;y+=44){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}ctx.restore();
 ctx.setLineDash([8,13]);ctx.strokeStyle='#8ca0d333';ctx.lineWidth=2;
 for(const x of [240]){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}ctx.setLineDash([]);
 for(let i=0;i<2;i++){ctx.fillStyle='#61f4e80c';ctx.fillRect(lanes[i]-45,0,90,H)}
}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawPlayer(t){
 const x=lanes[lane],pulse=1+Math.sin(t*.009)*.06;
 ctx.save();ctx.translate(x,playerY);ctx.scale(pulse,1/pulse);
 ctx.shadowBlur=28;ctx.shadowColor='#61f4e8';ctx.fillStyle='#61f4e8';
 rounded(-15,-15,30,30,10);ctx.fill();
 ctx.shadowBlur=0;ctx.fillStyle='#0a2030';rounded(-7,-5,5,5,2);ctx.fill();rounded(3,-5,5,5,2);ctx.fill();
 ctx.strokeStyle='#d9fff8';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,3,6,.15,Math.PI-.15);ctx.stroke();
 ctx.restore();
}
function drawObjects(t){
 for(const o of objects){ctx.save();ctx.translate(o.x,o.y);
 if(o.type==='block'){ctx.rotate(Math.sin(t*.003+o.phase)*.08);ctx.shadowBlur=22;ctx.shadowColor='#ff5eaa';ctx.fillStyle='#ff5eaa';rounded(-o.size/2,-o.size/2,o.size,o.size,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ffd2e7';ctx.lineWidth=2;rounded(-o.size/2+5,-o.size/2+5,o.size-10,o.size-10,4);ctx.stroke()}
 else{ctx.rotate(t*.003);ctx.shadowBlur=25;ctx.shadowColor='#ffe66d';ctx.fillStyle='#ffe66d';ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?6:13;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill()}
 ctx.restore()}
}
function drawParticles(dt){for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=240*dt;p.life-=dt;if(p.life<=0){particles.splice(i,1);continue}ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function update(dt,t){
 if(state!=='playing')return;
 elapsed+=dt;speed=210+Math.min(260,elapsed*5.2);spawn-=dt;
 if(spawn<=0){spawn=rand(.62,.95)*Math.max(.48,1-elapsed*.006);spawnObject()}
 for(let i=objects.length-1;i>=0;i--){
  let o=objects[i];o.y+=speed*dt;
  if(!o.passed&&o.y>playerY+28){
   o.passed=true;
   if(o.type==='block'&&o.lane===lane){gameOver();return}
   if(o.type==='block'&&o.lane!==lane){streak++;score+=1+(streak>=5?1:0);if(streak>=3){burst(lanes[lane],playerY,'#61f4e8',3);tone(680,.05)}}
  }
  if(o.type==='spark'&&o.lane===lane&&Math.abs(o.y-playerY)<24){score+=3;streak++;burst(o.x,o.y,'#ffe66d',12);tone(800,.1,'sine');objects.splice(i,1);continue}
  if(o.y>H+50)objects.splice(i,1);
 }
 for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=240*dt;p.life-=dt}
 particles=particles.filter(p=>p.life>0);
 updateHUD();
}
function render(t){
 const dt=Math.min(.035,(t-last)/1000||0);last=t;
 if(state==='playing')update(dt,t);
 ctx.save();if(shake>0){ctx.translate(rand(-shake,shake),rand(-shake,shake));shake*=.88}
 drawBackground(t);drawObjects(t);drawPlayer(t);drawParticles(dt);
 ctx.restore();
 if(state==='playing'){ctx.fillStyle='#9aa6c8';ctx.font='800 11px system-ui';ctx.textAlign='center';ctx.fillText('SURVIVE THE PULSE',240,32)}
 requestAnimationFrame(render);
}
function share(){
 const msg=`I scored ${score} on NEON DASH! Can you beat me?`;
 if(navigator.share){navigator.share({title:'NEON DASH',text:msg,url:location.href}).catch(()=>{})}
 else if(navigator.clipboard){navigator.clipboard.writeText(msg+' '+location.href).then(()=>alert('Score message copied! Share it with your friends.')).catch(()=>alert(msg))}
 else alert(msg);
}
$('startBtn').addEventListener('click',()=>{if(state==='paused')pause();else start()});
$('pauseBtn').addEventListener('click',pause);
$('soundBtn').addEventListener('click',()=>{sound=!sound;$('soundBtn').textContent=sound?'🔊 SOUND':'🔇 MUTED';if(sound)tone(550,.08)});
$('shareBtn').addEventListener('click',share);
$('howBtn').addEventListener('click',()=>{$('overlayEyebrow').textContent='HOW TO PLAY';$('overlayTitle').textContent='SWITCH. DODGE. SCORE.';$('overlayText').textContent='Tap, click, or press Space to switch between the two lanes. Avoid pink pulse blocks. Collect yellow sparks for bonus points. Survive longer to make the pulse faster.';$('startBtn').textContent=state==='playing'?'BACK TO GAME':'LET’S PLAY';$('overlay').classList.remove('hidden');if(state==='playing')state='paused';});
canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='playing')switchLane()});
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowLeft'||e.code==='ArrowRight'){e.preventDefault();if(state==='playing')switchLane();else if(state==='ready'||state==='over')start();else if(state==='paused')pause()}});
$('overlayTitle').innerHTML='READY<br>TO DASH?';
requestAnimationFrame(t=>{last=t;render(t)});
})();
</script>
</body>
</html>
